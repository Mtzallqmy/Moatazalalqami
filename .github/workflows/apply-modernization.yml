name: Apply modernization patches

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply-modernization.py'
      - 'scripts/apply-product-updates.py'
      - '.github/workflows/apply-modernization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patches
        run: |
          python3 scripts/apply-modernization.py
          python3 scripts/apply-product-updates.py

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Moataz Alaqami Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app workspace web-ui docs settings.gradle.kts
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'feat: apply Moataz Alaqami product modernization [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
