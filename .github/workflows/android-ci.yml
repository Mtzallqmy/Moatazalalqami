name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLAMA_CPP_SHA: 596a5795bdd6da317ea103fc06c0a71c296e3669
      MATERIAL_COLOR_UTILITIES_SHA: 6fd88eb3e95ba1d457842e2a2bf847d06b3a018a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Restore pinned source-only submodules
        shell: bash
        run: |
          set -euo pipefail

          checkout_revision() {
            local url="$1"
            local dir="$2"
            local sha="$3"

            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth 1 origin "$sha"
            git -C "$dir" checkout --detach -q FETCH_HEAD

            local actual
            actual="$(git -C "$dir" rev-parse HEAD)"
            test "$actual" = "$sha" || {
              echo "Revision mismatch for $dir: expected=$sha actual=$actual" >&2
              exit 1
            }
          }

          checkout_revision \
            https://github.com/material-foundation/material-color-utilities.git \
            material3/material-color-utilities \
            "$MATERIAL_COLOR_UTILITIES_SHA"

          checkout_revision \
            https://github.com/ggml-org/llama.cpp.git \
            llama-cpp/native/llama.cpp \
            "$LLAMA_CPP_SHA"

      - name: Configure ephemeral CI release signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -alias ci-release \
            -keyalg RSA -keysize 3072 -validity 30 \
            -dname "CN=Moataz Alaqami CI,O=CI,C=US"
          {
            echo "storeFile=$RUNNER_TEMP/ci-release.jks"
            echo 'storePassword=ci-release-password'
            echo 'keyAlias=ci-release'
            echo 'keyPassword=ci-release-password'
          } > local.properties

      - name: Clean, test all modules, lint, and build signed arm64 release
        id: gradle_build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean test lintRelease :app:assembleRelease \
            --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Summarize Gradle failure
        if: failure() && steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## Gradle test/build failure tail'
            echo '```text'
            tail -n 220 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle diagnostics
        if: failure() && steps.gradle_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-diagnostics
          path: gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify signature, SDK floor, and arm64-only ABI
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner-verify.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          echo "APK=$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo 'Unexpected non-arm64 native libraries found in APK' >&2
            exit 1
          fi
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moataz-alaqami-arm64-release-ci
          path: |
            app/build/outputs/apk/release/*.apk
            apksigner-verify.txt
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
