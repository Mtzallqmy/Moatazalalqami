name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Restore source-only submodules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf material3/material-color-utilities llama-cpp/native/llama.cpp
          git clone --depth 1 https://github.com/material-foundation/material-color-utilities.git material3/material-color-utilities
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama-cpp/native/llama.cpp

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build arm64 debug APK
        id: gradle_build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log

      - name: Summarize Gradle failure
        if: failure() && steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## Gradle failure tail'
            echo '```text'
            tail -n 220 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle diagnostics
        if: failure() && steps.gradle_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-diagnostics
          path: gradle-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Verify arm64 APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo 'Unexpected non-arm64 native libraries found in APK' >&2
            exit 1
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moataz-alaqami-arm64-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 14
