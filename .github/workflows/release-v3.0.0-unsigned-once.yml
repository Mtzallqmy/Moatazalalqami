name: Release unsigned v3.0.0 once

on:
  push:
    branches:
      - 'feat/product-updates'

permissions:
  contents: write

jobs:
  release-arm64-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LLAMA_CPP_SHA: 596a5795bdd6da317ea103fc06c0a71c296e3669
      MATERIAL_COLOR_UTILITIES_SHA: 6fd88eb3e95ba1d457842e2a2bf847d06b3a018a
      RELEASE_SHA: 9de7fe72e6497626b4eeb09a22c11eaa452bb18b
    steps:
      - name: Checkout exact merged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Disable release signing for this build only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          target = '            signingConfig = signingConfigs.getByName("release")\n'
          if target not in text:
              raise SystemExit('release signingConfig assignment not found')
          path.write_text(text.replace(target, '', 1))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Restore pinned source-only submodules
        shell: bash
        run: |
          set -euo pipefail
          checkout_revision() {
            local url="$1"
            local dir="$2"
            local sha="$3"
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth 1 origin "$sha"
            git -C "$dir" checkout --detach -q FETCH_HEAD
            local actual
            actual="$(git -C "$dir" rev-parse HEAD)"
            test "$actual" = "$sha"
          }
          checkout_revision https://github.com/material-foundation/material-color-utilities.git material3/material-color-utilities "$MATERIAL_COLOR_UTILITIES_SHA"
          checkout_revision https://github.com/ggml-org/llama.cpp.git llama-cpp/native/llama.cpp "$LLAMA_CPP_SHA"

      - name: Test and build unsigned arm64 APK and AAB
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease --stacktrace --console=plain

      - name: Verify unsigned release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          test -n "$APK"
          test -n "$AAB"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo 'Unexpected non-arm64 native libraries found in release APK' >&2
            exit 1
          fi
          if jarsigner -verify "$APK" >/dev/null 2>&1; then
            echo 'APK unexpectedly appears signed' >&2
            exit 1
          fi
          if jarsigner -verify "$AAB" >/dev/null 2>&1; then
            echo 'AAB unexpectedly appears signed' >&2
            exit 1
          fi
          echo "Unsigned APK: $APK"
          echo "Unsigned AAB: $AAB"

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moataz-alaqami-v3.0.0-unsigned-arm64
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release v3.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          target_commitish: ${{ env.RELEASE_SHA }}
          name: Moataz Alaqami v3.0.0 (Unsigned)
          generate_release_notes: true
          body: |
            This release is intentionally published without Android signing, per project-owner request.

            The APK and AAB are unsigned. The APK cannot be installed on standard Android devices until it is signed, and the AAB cannot be uploaded to Google Play until signing requirements are satisfied.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
