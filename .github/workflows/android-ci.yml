name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Restore source-only submodules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf material3/material-color-utilities llama-cpp/native/llama.cpp
          git clone --depth 1 https://github.com/material-foundation/material-color-utilities.git material3/material-color-utilities
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama-cpp/native/llama.cpp

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build arm64 debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moataz-alaqami-arm64-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 14
